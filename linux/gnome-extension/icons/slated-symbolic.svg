  <rect x="9.5" y="2" width="5.5" height="5.25" rx="1.25" fill="#2e3436" fill-opacity="0.8"/>
  <rect x="9.5" y="8.75" width="5.5" height="5.25" rx="1.25" fill="#2e3436" fill-opacity="0.6"/>
</svg>
