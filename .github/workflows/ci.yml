name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Package.swift needs Swift 6.2 (Xcode 26 or later).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build
      - name: Test
        run: swift run SlatedTests
      - name: Smoke test
        run: Tests/Smoke/run.sh
      - name: Bundle app
        run: make app
